# Desenvolvimento/implantação do ARKHER AI em um único serviço.
# Arquitetura: navegador → backend próprio → modelo próprio.
services:
  arkher:
    build: .
    ports:
      - "8710:8710"
    environment:
      ARKHER_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      ARKHER_SERVE_FRONTEND: "1"
    volumes:
      - arkher-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8710/api/health', timeout=8).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  arkher-data:
